schema_version = "1.0.0"

id = "blendergis"
version = "2.2.14"
name = "BlenderGIS"
tagline = "Various tools to handle geographic data"
maintainer = "domlysz"
# Supported types: "add-on", "theme"
type = "add-on"

website = "https://github.com/domlysz/BlenderGIS"

# Tags from the Blender add-on tag list:
# https://docs.blender.org/manual/en/dev/extensions/tags.html
tags = ["Import-Export", "3D View"]

# 4.3+: Blender 4.2 ignores wheel Python tags and may extract cp313 wheels into Python 3.11
blender_version_min = "4.3.0"
# Exclusive upper bound: untested against the next major release breaking changes
blender_version_max = "6.0.0"

# License conforming to https://spdx.org/licenses/
license = [
  "SPDX:GPL-3.0-or-later",
]

# Platforms covered by the bundled wheels (see tools/fetch_wheels.py)
platforms = ["windows-x64", "macos-arm64", "macos-x64", "linux-x64"]

# Bundled dependencies: laspy + lazrs (LAS/LAZ import) and pyproj (reprojection).
# cp311 wheels target Blender 4.3 -> 5.0, cp313 wheels target Blender 5.1+.
# Run `uv run --with pip tools/fetch_wheels.py` to download them before building.
wheels = [
  "./wheels/laspy-2.7.0-py3-none-any.whl",
  "./wheels/lazrs-0.8.2-cp311-cp311-macosx_10_12_x86_64.whl",
  "./wheels/lazrs-0.8.2-cp311-cp311-macosx_11_0_arm64.whl",
  "./wheels/lazrs-0.8.2-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
  "./wheels/lazrs-0.8.2-cp311-cp311-win_amd64.whl",
  "./wheels/lazrs-0.8.2-cp313-cp313-macosx_10_12_x86_64.whl",
  "./wheels/lazrs-0.8.2-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/lazrs-0.8.2-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
  "./wheels/lazrs-0.8.2-cp313-cp313-win_amd64.whl",
  "./wheels/pyproj-3.7.2-cp311-cp311-macosx_13_0_x86_64.whl",
  "./wheels/pyproj-3.7.2-cp311-cp311-macosx_14_0_arm64.whl",
  "./wheels/pyproj-3.7.2-cp311-cp311-manylinux_2_28_x86_64.whl",
  "./wheels/pyproj-3.7.2-cp311-cp311-win_amd64.whl",
  "./wheels/pyproj-3.7.2-cp313-cp313-macosx_13_0_x86_64.whl",
  "./wheels/pyproj-3.7.2-cp313-cp313-macosx_14_0_arm64.whl",
  "./wheels/pyproj-3.7.2-cp313-cp313-manylinux_2_28_x86_64.whl",
  "./wheels/pyproj-3.7.2-cp313-cp313-win_amd64.whl",
]

# Resources the add-on needs:
# - "network" : download basemaps, OSM/Overpass data, SRTM/DEM tiles and reproject through epsg.io
# - "files"   : read geodata files and read/write the tile cache folder
[permissions]
network = "Download basemaps, OSM data, DEM tiles and CRS definitions"
files = "Read geodata files and store the basemap tile cache"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/.gitignore",
  "/.vscode/",
  "*.zip",
  "/docs/",
  "/clients/",
  "/tools/",
  "/issue_template.md",
  ".DS_Store",
]
